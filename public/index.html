<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Halal Meal Planner</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    color-scheme: light dark;
    --bg: #fbfcfa;
    --fg: #24292e;
    --muted: #6e7781;
    --border: #e6e8eb;
    --card-bg: #ffffff;
    --accent: #2f9e5c;
    --accent-bg: #eafaf1;
    --danger: #d64545;
    --danger-bg: #fdecea;
    --warn: #b8860b;
    --warn-bg: #fdf3df;
    --shadow: 0 1px 2px rgba(0,0,0,0.04), 0 1px 1px rgba(0,0,0,0.03);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1f24;
      --fg: #e8e8e8;
      --muted: #9aa0a6;
      --border: #2e3238;
      --card-bg: #22262c;
      --accent: #4cc38a;
      --accent-bg: #1d3b2a;
      --danger: #e5766a;
      --danger-bg: #3a2220;
      --warn: #e3b356;
      --warn-bg: #3a2f14;
      --shadow: 0 1px 3px rgba(0,0,0,0.3), 0 1px 2px rgba(0,0,0,0.2);
    }
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 720px;
    margin: 2rem auto;
    padding: 0 1rem 4rem;
    line-height: 1.5;
    background: var(--bg);
    color: var(--fg);
  }
  h1 { font-size: 1.6rem; margin-bottom: 0.25rem; display: flex; align-items: center; gap: 0.5rem; }
  h1 svg { width: 26px; height: 26px; color: var(--accent); }
  .subtitle { color: var(--muted); margin-top: 0; margin-bottom: 1.5rem; font-size: 0.95rem; }
  .icon { width: 16px; height: 16px; flex: none; display: inline-block; vertical-align: -3px; }

  form {
    display: grid;
    gap: 1rem;
    padding: 1.25rem;
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 1.5rem;
    background: var(--card-bg);
    box-shadow: var(--shadow);
  }
  label { font-weight: 600; font-size: 0.85rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.02em; }
  select {
    display: block;
    width: 100%;
    margin-top: 0.4rem;
    padding: 0.65rem 0.75rem;
    font-size: 1rem;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--fg);
  }
  button {
    padding: 0.8rem 1rem;
    font-size: 1rem;
    font-weight: 600;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: white;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    transition: transform 0.1s ease, opacity 0.2s ease;
  }
  button:hover:not(:disabled) { transform: translateY(-1px); }
  button:disabled { opacity: 0.55; cursor: wait; transform: none; }
  button.secondary {
    background: var(--card-bg);
    color: var(--fg);
    border: 1px solid var(--border);
  }

  /* ---- status / "thinking" panel ---- */
  #status-panel {
    display: none;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.1rem 1.25rem;
    margin-bottom: 1.5rem;
    background: var(--card-bg);
    box-shadow: var(--shadow);
  }
  #status-panel.visible { display: block; animation: fadeIn 0.25s ease; }
  .status-step {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    padding: 0.4rem 0;
    font-size: 0.92rem;
    color: var(--muted);
    opacity: 0.45;
    transition: opacity 0.3s ease, color 0.3s ease;
  }
  .status-step.active { opacity: 1; color: var(--fg); }
  .status-step.done { opacity: 1; color: var(--fg); }
  .status-icon { flex: none; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; }
  .status-icon .spinner {
    width: 14px; height: 14px;
    border-radius: 50%;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    animation: spin 0.7s linear infinite;
    display: none;
  }
  .status-icon .check { width: 16px; height: 16px; color: var(--accent); display: none; }
  .status-icon .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--border); display: block; }
  .status-step.active .spinner { display: block; }
  .status-step.active .dot, .status-step.active .check { display: none; }
  .status-step.done .check { display: block; }
  .status-step.done .dot, .status-step.done .spinner { display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
  @keyframes slideIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  #save-bar {
    display: none;
    justify-content: flex-end;
    margin-bottom: 1rem;
  }
  #save-bar.visible { display: flex; }

  .meal {
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.1rem 1.25rem;
    margin-bottom: 1rem;
    background: var(--card-bg);
    box-shadow: var(--shadow);
    animation: slideIn 0.35s ease both;
  }
  .meal h3 { margin: 0 0 0.5rem 0; font-size: 1.05rem; display: flex; align-items: center; gap: 0.5rem; }
  .meal h3 .icon { color: var(--accent); width: 18px; height: 18px; }
  .slot-badge {
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    padding: 0.15rem 0.5rem;
    border-radius: 999px;
    background: var(--accent-bg);
    color: var(--accent);
  }
  .macros { font-size: 0.82rem; color: var(--muted); margin: 0.5rem 0; }
  .reasoning { font-style: italic; margin-top: 0.5rem; font-size: 0.9rem; color: var(--muted); }
  ul.ingredients { margin: 0.5rem 0; padding-left: 1.25rem; }
  ul.ingredients li { margin-bottom: 0.15rem; }

  .flag-panel {
    border: 1px solid var(--danger);
    background: var(--danger-bg);
    border-radius: 12px;
    padding: 1.1rem 1.25rem;
    margin-bottom: 1.5rem;
    animation: slideIn 0.35s ease both;
  }
  .flag-panel.clean { border-color: var(--accent); background: var(--accent-bg); }
  .flag-panel-title { display: flex; align-items: center; gap: 0.5rem; font-weight: 700; }
  .flag-panel-title .icon { width: 18px; height: 18px; }
  .flag-panel .icon { color: var(--danger); }
  .flag-panel.clean .icon { color: var(--accent); }
  .flag-item { margin-bottom: 0.5rem; font-size: 0.9rem; display: flex; align-items: flex-start; gap: 0.4rem; }
  .flag-item .icon { margin-top: 0.15rem; }
  .flag-status { font-weight: 700; text-transform: uppercase; font-size: 0.78rem; padding: 0.1rem 0.4rem; border-radius: 4px; }
  .flag-status.haram { color: var(--danger); background: var(--danger-bg); }
  .flag-status.mashbooh { color: var(--warn); background: var(--warn-bg); }
  .stage-label { font-weight: 700; margin-top: 0.85rem; display: block; }
  .stage-label:first-of-type { margin-top: 0.5rem; }
  .flag-resolved { display: flex; align-items: center; gap: 0.4rem; margin-top: 0.5rem; font-weight: 700; }
  .flag-resolved .icon { color: var(--accent); }

  #error { color: var(--danger); font-weight: 600; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.4rem; }

  @media print {
    body { max-width: 100%; margin: 0; padding: 1rem; background: #fff; color: #000; }
    form, #status-panel, #save-bar, #error, h1 svg + br { display: none !important; }
    .subtitle { display: none; }
    .meal, .flag-panel { box-shadow: none; border: 1px solid #ccc; break-inside: avoid; }
    button { display: none !important; }
  }
</style>
</head>
<body>
  <h1><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4"/><path d="M5 10a7 7 0 0 1 14 0v9a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1z"/><path d="M2 21h20"/></svg> Halal Meal Planner</h1>
  <p class="subtitle">Get 3 meals for the day based on your activity level and sleep quality — filtered by diet type. For halal, every ingredient is checked against a curated flag list before it reaches you, and corrected if needed.</p>

  <form id="meal-form">
    <div>
      <label for="activity">Activity today</label>
      <select id="activity" name="activity">
        <option value="trained hard today (intense workout)">Trained hard today (intense workout)</option>
        <option value="light activity today (walk, light exercise)">Light activity today</option>
        <option value="rest day, no exercise">Rest day, no exercise</option>
      </select>
    </div>
    <div>
      <label for="sleepQuality">Sleep quality last night</label>
      <select id="sleepQuality" name="sleepQuality">
        <option value="slept well, 7-9 hours">Slept well (7-9 hours)</option>
        <option value="slept poorly, under 5 hours">Slept poorly (under 5 hours)</option>
        <option value="average sleep, around 6 hours">Average sleep (~6 hours)</option>
      </select>
    </div>
    <div>
      <label for="dietType">Diet type</label>
      <select id="dietType" name="dietType">
        <option value="halal">Halal</option>
        <option value="vegan">Vegan</option>
        <option value="meat-only">Meat-only</option>
      </select>
    </div>
    <button type="submit" id="submit-btn">Generate meals</button>
  </form>

  <div id="error"></div>
  <div id="status-panel"></div>
  <div id="save-bar">
    <button type="button" class="secondary" id="save-btn">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Save as PDF
    </button>
  </div>
  <div id="results"></div>

  <script>
    const ICONS = {
      sunrise: '<path d="M17 18a5 5 0 0 0-10 0"/><line x1="12" y1="2" x2="12" y2="9"/><line x1="4.22" y1="10.22" x2="5.64" y2="11.64"/><line x1="1" y1="18" x2="3" y2="18"/><line x1="21" y1="18" x2="23" y2="18"/><line x1="18.36" y1="11.64" x2="19.78" y2="10.22"/><line x1="23" y1="22" x2="1" y2="22"/><polyline points="8 6 12 2 16 6"/>',
      sun: '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>',
      moon: '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>',
      utensils: '<path d="M3 2v7c0 1.1.9 2 2 2h2a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M17 2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3v7"/>',
      alert: '<path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>',
      check: '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 17.01"/>',
      xCircle: '<circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>',
    };
    function icon(name, extraClass) {
      return `<svg class="icon${extraClass ? " " + extraClass : ""}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[name] || ""}</svg>`;
    }

    const form = document.getElementById("meal-form");
    const resultsEl = document.getElementById("results");
    const errorEl = document.getElementById("error");
    const submitBtn = document.getElementById("submit-btn");
    const statusPanel = document.getElementById("status-panel");
    const saveBar = document.getElementById("save-bar");
    const saveBtn = document.getElementById("save-btn");

    saveBtn.addEventListener("click", () => window.print());

    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

    // Mirrors the real backend pipeline (server.js): generate -> deterministic
    // check -> (halal + flagged only) regenerate -> re-check. These steps are
    // real stages of the actual request, just paced for the UI rather than
    // dumped on screen the instant the response lands.
    const BASE_STEPS = [
      { key: "send", label: "Sending your preferences to the AI chef", delay: 500 },
      { key: "generate", label: "AI is thinking up 3 meals for you", delay: 1300 },
      { key: "check", label: "Running the deterministic halal safety check", delay: 900 },
    ];
    const CORRECTION_STEPS = [
      { key: "flag", label: "Found ingredients that need verification", delay: 700 },
      { key: "regenerate", label: "Asking the AI to fix those meals", delay: 1300 },
      { key: "recheck", label: "Re-checking the corrected meals", delay: 700 },
    ];

    function renderStatusSteps(steps) {
      statusPanel.innerHTML = steps
        .map(
          (s) => `<div class="status-step" data-key="${s.key}">
            <span class="status-icon">
              <span class="spinner"></span>
              ${icon("check", "check")}
              <span class="dot"></span>
            </span>
            <span>${s.label}</span>
          </div>`
        )
        .join("");
    }

    function setStepState(key, state) {
      const el = statusPanel.querySelector(`[data-key="${key}"]`);
      if (!el) return;
      el.classList.remove("active", "done");
      if (state) el.classList.add(state);
    }

    async function runSteps(steps) {
      for (const s of steps) {
        setStepState(s.key, "active");
        await sleep(s.delay);
        setStepState(s.key, "done");
      }
    }

    // Like runSteps, but the final step's spinner stays active until
    // `waitFor` actually resolves (not just its nominal delay) — so if the
    // real request is slower than the animation, the user sees a spinner
    // covering that wait instead of a "done" list sitting in front of dead air.
    async function runStepsAwaiting(steps, waitFor) {
      for (let i = 0; i < steps.length - 1; i++) {
        const s = steps[i];
        setStepState(s.key, "active");
        await sleep(s.delay);
        setStepState(s.key, "done");
      }
      const last = steps[steps.length - 1];
      setStepState(last.key, "active");
      const [, result] = await Promise.all([sleep(last.delay), waitFor]);
      setStepState(last.key, "done");
      return result;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.textContent = "";
      resultsEl.innerHTML = "";
      saveBar.classList.remove("visible");
      submitBtn.disabled = true;
      submitBtn.textContent = "Generating...";

      statusPanel.classList.add("visible");
      renderStatusSteps(BASE_STEPS);

      const payload = {
        activity: document.getElementById("activity").value,
        sleepQuality: document.getElementById("sleepQuality").value,
        dietType: document.getElementById("dietType").value,
      };

      try {
        const fetchPromise = fetch("/api/generate-meals", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        }).then(async (res) => {
          const body = await res.json();
          if (!res.ok) throw new Error(body.error || "Request failed");
          return body;
        });

        // Walk the base steps at a human-readable pace; the final step's
        // spinner keeps running past its nominal delay if the real request
        // is still in flight, so there's never a "done" list sitting in
        // front of a still-pending response.
        const data = await runStepsAwaiting(BASE_STEPS, fetchPromise);

        const hadInitialFlags = data.flags.some((s) => s.stage === "initial" && s.flags.length > 0);
        if (hadInitialFlags && data.corrected) {
          renderStatusSteps([...BASE_STEPS, ...CORRECTION_STEPS]);
          BASE_STEPS.forEach((s) => setStepState(s.key, "done"));
          await runSteps(CORRECTION_STEPS);
        }

        statusPanel.classList.remove("visible");
        render(data);
        saveBar.classList.add("visible");
      } catch (err) {
        statusPanel.classList.remove("visible");
        errorEl.innerHTML = icon("xCircle") + "Error: " + err.message;
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Generate meals";
      }
    });

    function render(data) {
      renderFlagPanel(data);
      renderMeals(data.meals);
    }

    function renderFlagPanel(data) {
      const anyFlagsEver = data.flags.some((s) => s.flags.length > 0);
      const panel = document.createElement("div");
      panel.className = "flag-panel" + (anyFlagsEver ? "" : " clean");

      if (!anyFlagsEver) {
        panel.innerHTML = `<div class="flag-panel-title">${icon("check")}No halal flags raised</div><div style="margin-top:0.4rem;">Every ingredient passed the deterministic checker on the first try.</div>`;
        resultsEl.appendChild(panel);
        return;
      }

      let html = `<div class="flag-panel-title">${icon("alert")}Halal compliance check — before/after</div>`;
      for (const stage of data.flags) {
        html += `<span class="stage-label">${stage.stage === "initial" ? "Initial generation" : "After AI regeneration"}:</span>`;
        if (stage.flags.length === 0) {
          html += `<div class="flag-item">No flags at this stage.</div>`;
        } else {
          for (const f of stage.flags) {
            html += `<div class="flag-item">${icon("alert")}<span><span class="flag-status ${f.status}">${f.status}</span> — "${f.ingredient}" in <em>${f.meal}</em>: ${f.reason}</span></div>`;
          }
        }
      }
      if (data.corrected && data.remainingFlags.length === 0) {
        html += `<div class="flag-resolved">${icon("check")}All flags resolved after one regeneration pass.</div>`;
      } else if (data.corrected && data.remainingFlags.length > 0) {
        html += `<div class="flag-item" style="margin-top:0.5rem;">${icon("alert")}<strong>Some flags remained after regeneration — review below.</strong></div>`;
      }
      panel.innerHTML = html;
      resultsEl.appendChild(panel);
    }

    const SLOT_ICON = { breakfast: "sunrise", lunch: "sun", dinner: "moon" };

    function renderMeals(meals) {
      meals.forEach((meal, i) => {
        const div = document.createElement("div");
        div.className = "meal";
        div.style.animationDelay = `${i * 80}ms`;
        const iconName = SLOT_ICON[meal.slot] || "utensils";
        div.innerHTML = `
          <h3>${icon(iconName)}<span class="slot-badge">${meal.slot}</span> ${meal.name}</h3>
          <ul class="ingredients">${meal.ingredients.map((i) => `<li>${i}</li>`).join("")}</ul>
          <div class="macros">Calories: ${meal.macros.calories} · Protein: ${meal.macros.protein_g}g · Carbs: ${meal.macros.carbs_g}g · Fat: ${meal.macros.fat_g}g</div>
          <div class="reasoning">${meal.reasoning}</div>
        `;
        resultsEl.appendChild(div);
      });
    }
  </script>
</body>
</html>
